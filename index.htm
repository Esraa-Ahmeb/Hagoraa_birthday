<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
   
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    
    background-image: url('Untitled design (2).png');
    
    /* هنا بنسمح للصورة بالتكرار عشان تملى الشاشة */
    background-repeat: repeat; 
    
    /* هنا بنصغر حجم الصورة (مثلاً نخلي عرضها 350 بكسل وباقي الأبعاد تتظبط تلقائي) */
    background-size: 350px auto; 
    
    background-position: top left;
    overflow: hidden;
}

.container{
    text-align:center;
    z-index: 5;
}

h1{
    color:white;
    margin-bottom:20px;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); /* ضفنا ضل عشان العنوان الأبيض يبان فوق الصور */
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#ff4081;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

#gift{
    display:none;
    position:relative;
    width:400px;
    height:400px;
    margin:auto;
    cursor:pointer;
}

/* Gift Box */
.box{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    height:220px;
    background:#ff4081;
    border-radius:15px;
}

.lid{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:120px;
    width:350px;
    height:60px;
    background:#e91e63;
    border-radius:15px;
    transition:1s;
}

.ribbon-v{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:280px;
    background:gold;
}

.ribbon-h{
    position:absolute;
    top:140px;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    height:40px;
    background:gold;
}

/* Message Card */
.card{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:80px;
    width:340px;
    background: rgba(255, 255, 255, 0.95); /* خليناها شفافة حاجة بسيطة عشان تليق مع الخلفية */
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.4);
    opacity:0;
    transition:1.5s;
    z-index:10;
}

.card.show{
    opacity:1;
    bottom:260px;
}

.card h2{
    color:#ff4081;
    margin-bottom:10px;
}

.card p{
    color:#444;
    font-size:18px;
}

/* Balloons */
.balloons{
    font-size:50px;
    margin-bottom:10px;
}

/* Flying Emojis */
.emoji{
    position:absolute;
    font-size:30px;
    animation:fly 4s linear forwards;
    z-index: 100;
}

@keyframes fly{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-500px);
    }
}
</style>
</head>
<body>

<div class="container">

    <h1>🎂 Happy Birthday Hagoraa🎂</h1>

    <button onclick="showGift()">Show Gift 🎁</button>

    <div id="gift">

        <div class="card" id="card">
            <div class="balloons">🎈 🎈 🎈</div>

            <h2>🎉 Happy Birthday Hagoraa! 🎉</h2>

            <p>
                Wishing you happiness, success,
                love and lots of beautiful memories ❤️
            </p>
        </div>

        <div class="lid" id="lid"></div>
        <div class="box"></div>
        <div class="ribbon-v"></div>
        <div class="ribbon-h"></div>

    </div>

</div>

<script>

function showGift(){
    document.getElementById("gift").style.display="block";
}

document.getElementById("gift").addEventListener("click", openGift);

function openGift(){

    document.getElementById("lid").style.opacity="0";

    setTimeout(()=>{
        document.getElementById("card").classList.add("show");
        createEmojis();
    },500);
}

function createEmojis(){

    const emojis=["🎉","🎊","✨","🎈","🎂","💖"];

    for(let i=0;i<40;i++){

        const emoji=document.createElement("div");
        emoji.className="emoji";

        emoji.innerHTML=
            emojis[Math.floor(Math.random()*emojis.length)];

        emoji.style.left=
            Math.random()*window.innerWidth+"px";

        emoji.style.top=
            (window.innerHeight-250)+"px";

        emoji.style.animationDuration=
            (2+Math.random()*3)+"s";

        document.body.appendChild(emoji);

        setTimeout(()=>{
            emoji.remove();
        },5000);
    }
}

</script>

</body>
</html>
